<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Routinen-Tagebuch">
  <rect width="512" height="512" rx="112" fill="#12141c"/>
  <!-- Mondsichel: Vollkreis, aus dem ein versetzter Kreis ausgestanzt ist -->
  <mask id="crescent">
    <rect width="512" height="512" fill="#000"/>
    <circle cx="256" cy="250" r="118" fill="#fff"/>
    <circle cx="310" cy="212" r="104" fill="#000"/>
  </mask>
  <circle cx="256" cy="250" r="118" fill="#7c9cf5" mask="url(#crescent)"/>
  <!-- drei Punkte als Tagesreihe -->
  <g fill="#7fd1a8">
    <circle cx="196" cy="392" r="15"/>
    <circle cx="256" cy="392" r="15"/>
    <circle cx="316" cy="392" r="15" fill="#2f3445"/>
  </g>
</svg>
